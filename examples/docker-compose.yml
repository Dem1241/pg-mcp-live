services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-mcp-live-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgmcp
      POSTGRES_PASSWORD: pgmcp
      POSTGRES_DB: pg_mcp_live_demo
    ports:
      - "5433:5432"
    volumes:
      - pg_mcp_live_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgmcp -d pg_mcp_live_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_mcp_live_data:
